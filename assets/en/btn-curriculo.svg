<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="153" height="46" viewBox="0 0 153 46">
<style>
  .bg { fill: #fdfbf7; } .surface { fill: #ffffff; } .line { stroke: #ece6f2; }
  .ink { fill: #2f2a3d; } .muted { fill: #6f6880; } .accent { fill: #7a5cd6; }
  .chiptxt { fill: #2f2a3d; } .blob { opacity: .55; }
  .serif { font-family: Georgia, 'Times New Roman', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fade { opacity: 0; animation: fade .8s ease forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1a24; } .surface { fill: #252231; } .line { stroke: #36324a; }
    .ink { fill: #f2eefb; } .muted { fill: #b2abc4; } .accent { fill: #c9b6ff; }
    .blob { opacity: .2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
</style>
<defs></defs>
<rect class="surface line" x=".5" y=".5" width="152" height="45" rx="22.5" stroke-width="1"/><text class="ink sans" x="76.5" y="29" font-size="15" font-weight="600" text-anchor="middle">📄  Résumé (PT)</text>
</svg>
