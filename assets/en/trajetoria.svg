  <text class="accent sans" x="58" y="490" font-size="14" font-weight="600">UFOP</text>
  <text class="muted sans" x="58" y="516" font-size="14">Automated data extraction, cleaning and integration in Python, with PostgreSQL for database design and queries.</text>
