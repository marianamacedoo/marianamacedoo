  <text class="muted sans" x="58" y="102" font-size="14">ETL pipelines in Python and SQL for large data volumes. Managing environments with Apache Airflow, Apache Doris and Apache</text><text class="muted sans" x="58" y="123" font-size="14">Superset.</text>
