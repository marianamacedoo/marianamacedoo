<text class="ink sans" x="26" y="92" font-size="18" font-weight="700">Thesis I · Automatic classification of programming error messages</text>
<text class="muted sans" x="26" y="120" font-size="14">First stage of my undergraduate thesis. It classifies C compilation errors by the programming topic behind them, as a</text><text class="muted sans" x="26" y="141" font-size="14">basis for an educational recommender system. Reached 94% accuracy using only the error message.</text>
