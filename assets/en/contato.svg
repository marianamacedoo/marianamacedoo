<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="210" viewBox="0 0 1000 210">
<style>
  .bg { fill: #fdfbf7; } .surface { fill: #ffffff; } .line { stroke: #ece6f2; }
  .ink { fill: #2f2a3d; } .muted { fill: #6f6880; } .accent { fill: #7a5cd6; }
  .chiptxt { fill: #2f2a3d; } .blob { opacity: .55; }
  .serif { font-family: Georgia, 'Times New Roman', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fade { opacity: 0; animation: fade .8s ease forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1a24; } .surface { fill: #252231; } .line { stroke: #36324a; }
    .ink { fill: #f2eefb; } .muted { fill: #b2abc4; } .accent { fill: #c9b6ff; }
    .blob { opacity: .2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
</style>
<defs><clipPath id="frame"><rect width="1000" height="210" rx="28"/></clipPath><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter></defs>
<rect class="bg line" x=".5" y=".5" width="999" height="209" rx="28" stroke-width="1"/>
<g clip-path="url(#frame)" filter="url(#blur)">
<circle class="blob" cx="80" cy="10" r="150" fill="#c9b6ff"><animateTransform attributeName="transform" type="translate" values="0 0; 40 50; -30 20; 0 0" dur="16s" repeatCount="indefinite"/></circle>
<circle class="blob" cx="920" cy="94" r="130" fill="#ffd3b8"><animateTransform attributeName="transform" type="translate" values="0 0; -50 30; 20 -30; 0 0" dur="19s" repeatCount="indefinite"/></circle>
<circle class="blob" cx="350" cy="210" r="120" fill="#bdebd7"><animateTransform attributeName="transform" type="translate" values="0 0; 50 -30; -20 -10; 0 0" dur="22s" repeatCount="indefinite"/></circle>
</g>
<text class="accent sans fade" x="500" y="64" font-size="13" font-weight="700" letter-spacing="2.4" text-anchor="middle">CONTACT</text>
<text class="ink serif fade" style="animation-delay:.15s" x="500" y="114" font-size="38" font-weight="600" text-anchor="middle">Let's talk?</text>
<text class="muted sans fade" style="animation-delay:.3s" x="500" y="156" font-size="16" text-anchor="middle">I'm looking for opportunities in data science. Feel free to reach out!</text>
</svg>
