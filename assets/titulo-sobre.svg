<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="96" viewBox="0 0 1000 96">
<style>
  .bg { fill: #fdfbf7; } .surface { fill: #ffffff; } .line { stroke: #ece6f2; }
  .ink { fill: #2f2a3d; } .muted { fill: #6f6880; } .accent { fill: #7a5cd6; }
  .chiptxt { fill: #2f2a3d; } .blob { opacity: .55; }
  .serif { font-family: Georgia, 'Times New Roman', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fade { opacity: 0; animation: fade .8s ease forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1a24; } .surface { fill: #252231; } .line { stroke: #36324a; }
    .ink { fill: #f2eefb; } .muted { fill: #b2abc4; } .accent { fill: #c9b6ff; }
    .blob { opacity: .2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
</style>
<defs></defs>
<text class="accent sans fade" x="4" y="26" font-size="13" font-weight="700" letter-spacing="2.4">SOBRE MIM</text>
<text class="ink serif fade" style="animation-delay:.15s" x="2" y="68" font-size="34" font-weight="600">Dados, curiosidade e café</text>
<path d="M4,84 q 12,-8 24,0 t 24,0 t 24,0 t 24,0 t 24,0" fill="none" stroke="#c9b6ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="140">
  <animate attributeName="stroke-dashoffset" values="140;0;0;140" keyTimes="0;.25;.8;1" dur="6s" repeatCount="indefinite"/></path>
</svg>
